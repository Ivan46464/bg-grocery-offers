# Keeps the free Render instance awake.
#
# Render's free tier spins the service down after 15 min without traffic and
# the next request then takes 30-50 s. Pinging /health every 10 minutes keeps
# it warm (one service 24/7 fits in Render's 750 free instance-hours/month).
# While awake, the API re-scrapes all stores by itself every 12 h
# (SCRAPE_INTERVAL_HOURS), so no separate refresh job is needed.
#
# GitHub pauses scheduled workflows on repos with no commits for 60 days -
# just push something (or run the workflow manually) to resume.
name: keep-alive

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub may delay a few minutes)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: curl -fsS --max-time 90 https://bg-grocery-offers-api.onrender.com/health
